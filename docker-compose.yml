services:
  mysql:
    image: mysql:8.0
    container_name: camera_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: nvr_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  flask_app:
    image: pyjoek/goldcameramonitor-backend:latest
    ports:
      - "8000:80"

  react_app:
    image: pyjoek/goldcameramonitor-frontend:latest

volumes:
  mysql_data:
